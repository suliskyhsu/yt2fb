name: tmp-whisper-transcription
on:
  push:
    branches: [tmp-whisper-y4oxuxycb54]

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          pip install -q openai-whisper yt-dlp
      - name: Download audio
        run: |
          yt-dlp -x --audio-format wav -o input.%(ext)s 'https://youtube.com/shorts/y4OxUxYCb54'
      - name: Transcribe with Whisper
        run: |
          whisper input.wav --model small.en --language English --task transcribe --output_format all --output_dir transcript --verbose False
      - name: Upload transcript
        uses: actions/upload-artifact@v4
        with:
          name: whisper-transcript
          path: transcript/
