name: tmp-bundle-whisper-small

on:
  push:
    branches:
      - tmp-spanish-transcript-20260827-v2
    paths:
      - '.github/workflows/tmp-bundle-whisper.yml'

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download Whisper package, tiktoken wheel, and official small model
        run: |
          mkdir -p bundle/wheels bundle/models
          python -m pip download --no-deps --dest bundle/wheels openai-whisper==20250625
          python -m pip download --only-binary=:all: --no-deps --dest bundle/wheels tiktoken
          python - <<'PY'
          import hashlib
          import urllib.request
          from pathlib import Path

          url = 'https://openaipublic.azureedge.net/main/whisper/models/9ecf779972d90ba49c06d968637d720dd632c55bbf19d441fb42bf17a411e794/small.pt'
          target = Path('bundle/models/small.pt')
          with urllib.request.urlopen(url) as r, target.open('wb') as f:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk:
                      break
                  f.write(chunk)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          expected = '9ecf779972d90ba49c06d968637d720dd632c55bbf19d441fb42bf17a411e794'
          print('size', target.stat().st_size, 'sha256', digest)
          if digest != expected:
              raise SystemExit('model checksum mismatch')
          Path('bundle/SHA256SUMS.txt').write_text(f'{digest}  models/small.pt\n')
          PY
          find bundle -type f -printf '%P %s bytes\n' | sort | tee bundle/files.txt
      - name: Upload portable Whisper bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-python313-bundle
          path: bundle/
          compression-level: 0
          retention-days: 1
